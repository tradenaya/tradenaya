# Auto-deploy: every merge (push) to main deploys to the VPS.
#
# Connects over SSH and runs scripts/deploy.sh from the latest main, which
# pulls, installs, builds beside the live app, restarts pm2, checks the app is
# up, and rolls back by itself if anything fails. Setup: see DEPLOY.md.
name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch: # "Run workflow" button in the Actions tab, for a manual redeploy

# Never run two deploys at once; a newer merge waits for the running deploy.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Prepare SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          if [ -z "$SSH_KEY" ] || [ -z "$KNOWN_HOSTS" ]; then
            echo "::error::Missing DEPLOY_SSH_KEY or DEPLOY_KNOWN_HOSTS secret — see DEPLOY.md."
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy on the server
        env:
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          PM2_APP: ${{ vars.PM2_APP || 'tradenaya' }}
          APP_PORT: ${{ vars.APP_PORT || '3000' }}
        run: |
          # Run the deploy script as it is on origin/main (not the server's
          # older copy), so changes to the script itself apply immediately.
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ServerAliveInterval=30 "$SSH_USER@$SSH_HOST" \
            "cd ~/tradenaya && git fetch --quiet origin main && git show origin/main:scripts/deploy.sh | PM2_APP='$PM2_APP' PORT='$APP_PORT' bash -s"
